<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masi Saloon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c9a84c;--dark:#111;--card:#1a1a1a;--border:#2e2e2e;--text:#e8e8e8;--muted:#888;--red:#c0392b;--green:#27ae60;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  body.ta{font-family:'Noto Sans Tamil',sans-serif;}

  /* DB status */
  #db-status{text-align:center;font-size:.75rem;padding:6px;background:#0a0a0a;color:var(--muted);letter-spacing:.5px;}
  #db-status.connected{color:var(--green);}
  #db-status.error{color:var(--red);}

  /* Closed banner */
  #closed-banner{display:none;background:var(--red);color:#fff;text-align:center;padding:14px 20px;font-size:1rem;font-weight:600;}

  /* Header */
  header{text-align:center;padding:28px 20px 16px;border-bottom:1px solid var(--border);position:relative;}
  header h1{font-family:'Playfair Display',serif;font-size:2.3rem;color:var(--gold);letter-spacing:2px;}
  header p{color:var(--muted);font-size:.9rem;margin-top:4px;}
  .contact-strip{display:flex;justify-content:center;gap:24px;margin-top:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;}
  .contact-strip a{color:var(--gold);text-decoration:none;}

  /* Language switcher */
  .lang-switch{display:flex;justify-content:center;gap:0;margin-top:14px;}
  .lang-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:.82rem;padding:6px 18px;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif;}
  .lang-btn:first-child{border-radius:20px 0 0 20px;}
  .lang-btn:last-child{border-radius:0 20px 20px 0;}
  .lang-btn.active{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700;}

  /* Nav */
  nav{display:flex;justify-content:center;border-bottom:1px solid var(--border);overflow-x:auto;}
  nav button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.92rem;padding:13px 18px;cursor:pointer;border-bottom:3px solid transparent;transition:.2s;white-space:nowrap;}
  nav button.active,nav button:hover{color:var(--gold);border-bottom-color:var(--gold);}

  /* Pages */
  .page{display:none;max-width:720px;margin:0 auto;padding:26px 16px 60px;}
  .page.active{display:block;}
  .section-label{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:700;}

  /* Slots */
  .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;}
  .slot{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s;font-size:.88rem;}
  .slot:hover:not(.booked):not(.blocked-slot){border-color:var(--gold);color:var(--gold);}
  .slot.booked{opacity:.38;cursor:default;text-decoration:line-through;color:var(--muted);}
  .slot.blocked-slot{opacity:.35;cursor:default;background:#1f0000;color:var(--red);}
  .slot.selected{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700;}

  /* Form */
  .form-group{margin-bottom:15px;}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;letter-spacing:.3px;}
  input,select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.95rem;padding:12px 14px;outline:none;transition:.15s;}
  input:focus,select:focus{border-color:var(--gold);}
  select option{background:#222;}
  .btn{display:block;width:100%;background:var(--gold);color:#111;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;padding:15px;border:none;border-radius:8px;cursor:pointer;letter-spacing:.5px;transition:.15s;}
  body.ta .btn{font-family:'Noto Sans Tamil',sans-serif;font-size:.95rem;}
  .btn:hover{opacity:.88;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Owner panel */
  .owner-login{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:360px;margin:0 auto;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;gap:12px;}
  .toggle-row span{font-size:.92rem;line-height:1.4;}
  .toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
  .toggle input{opacity:0;width:0;height:0;}
  .slider{position:absolute;inset:0;background:#333;border-radius:24px;cursor:pointer;transition:.3s;}
  .slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
  input:checked+.slider{background:var(--green);}
  input:checked+.slider:before{transform:translateX(20px);}
  .bookings-list{display:flex;flex-direction:column;gap:10px;}
  .booking-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .booking-card .bname{font-weight:600;font-size:.95rem;}
  .booking-card .btime{font-size:.82rem;color:var(--gold);margin-top:2px;}
  .booking-card .bservice{font-size:.78rem;color:var(--muted);}
  .del-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:.78rem;cursor:pointer;transition:.15s;flex-shrink:0;}
  .del-btn:hover{border-color:var(--red);color:var(--red);}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:.9rem;}

  /* QR */
  .qr-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;text-align:center;}
  .qr-box p{color:var(--muted);font-size:.88rem;margin-top:10px;}
  .qr-placeholder{width:200px;height:200px;margin:0 auto 12px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .qr-placeholder img{width:100%;height:100%;object-fit:contain;}
  .qr-upload-label{display:inline-block;margin-top:14px;background:none;border:1px dashed var(--gold);color:var(--gold);border-radius:8px;padding:9px 20px;font-size:.85rem;cursor:pointer;}
  #qr-input{display:none;}

  /* Toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;border-radius:8px;padding:12px 24px;font-weight:600;font-size:.88rem;display:none;z-index:999;max-width:90vw;text-align:center;}

  /* Closed display */
  .closed-img-wrap{text-align:center;margin-top:16px;display:none;}
  .closed-img-wrap img{max-width:260px;width:100%;border-radius:12px;opacity:.85;}
  .closed-msg{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--red);margin-top:12px;}
  body.ta .closed-msg{font-family:'Noto Sans Tamil',sans-serif;}

  .divider{border:none;border-top:1px solid var(--border);margin:22px 0;}
  .date-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .date-row input[type=date]{flex:1;min-width:150px;}
  .day-tag{font-size:.8rem;color:var(--gold);background:#1c1500;border:1px solid #3a2e00;border-radius:6px;padding:6px 12px;white-space:nowrap;}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .legend{margin-top:18px;display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;}
</style>
</head>

    <p style="margin-top:6px;">Manickam · <strong style="color:var(--gold)">7397509402</strong></p>

  </div>
</div>

    blockSlots:    "நேரங்களை தடு / திற",
    blockHint:     "ஒரு நேரத்தை தட்டி தடு அல்லது திறக்கவும்.",
    allBookings:   "அனைத்து பதிவுகள்",
    remove:        "நீக்கு",
    noBookings:    "இன்னும் பதிவுகள் இல்லை.",
    // toasts
    tClosed:       "இன்று சலூன் மூடப்பட்டுள்ளது!",
    tSelectSlot:   "ஒரு நேரத்தை தேர்ந்தெடுக்கவும்",
    tEnterName:    "உங்கள் பெயர் உள்ளிடவும்",
    tValidPhone:   "சரியான 10 இலக்க தொலைபேசி எண் உள்ளிடவும்",
    tSelectSvc:    "ஒரு சேவையை தேர்ந்தெடுக்கவும்",
    tSlotGone:     "இந்த நேரம் பதிவாகிவிட்டது! வேறு நேரம் தேர்ந்தெடுக்கவும்.",
    tSaving:       "சேமிக்கிறோம்…",
    tBooked:       (slot, day) => `✅ பதிவாகியது! ${slot} — ${day}`,
    tBookFail:     "❌ பதிவு தோல்வியடைந்தது. இணைப்பு சரிபார்க்கவும்.",
    tBlocked:      s => `🔒 ${s} தடுக்கப்பட்டது`,
    tUnblocked:    s => `✅ ${s} திறக்கப்பட்டது`,
    tSlotErr:      "நேரம் சேமிப்பில் பிழை",
    tWrongPass:    "தவறான கடவுச்சொல்",
    tSalonClosed:  "🚫 சலூன் மூடப்பட்டதாக குறிக்கப்பட்டது",
    tSalonOpen:    "✅ சலூன் திறக்கப்பட்டது",
    tStatusErr:    "நிலை மாற்றுவதில் பிழை",
    tRemoved:      "பதிவு நீக்கப்பட்டது",
    tRemoveErr:    "பதிவு நீக்குவதில் பிழை",
    tQRSaved:      "QR கோட் சேமிக்கப்பட்டது!",
    tConnected:    "🟢 சர்வர் இணைக்கப்பட்டது — நேரலை ஒத்திசைவு",
    tDBError:      e => `🔴 DB பிழை: ${e}`,
    tConnFail:     "🔴 சர்வர் இணைப்பு தோல்வி",
  }
};

// ── State ──
let lang         = localStorage.getItem('masi_lang') || 'en';
let bookings     = [];
let settings     = {closed:false};
let blocked      = {};
let selectedSlot = null;

// ── Shorthand ──
const $ = id => document.getElementById(id);
const t = key => T[lang][key] || T['en'][key] || '';
const today = () => new Date().toISOString().split('T')[0];

function dayLabel(d) {
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(lang==='ta') {
    const days   = ['ஞாயிறு','திங்கள்','செவ்வாய்','புதன்','வியாழன்','வெள்ளி','சனி'];
    const months = ['ஜன','பிப்','மார்','ஏப்','மே','ஜூன்','ஜூலை','ஆக','செப்','அக்','நவ','டிச'];
    return `${days[dt.getDay()]}, ${dt.getDate()} ${months[dt.getMonth()]}`;
  }
  return dt.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'});
}

function toast(msg, dur=2900) {
  const el=$('toast'); el.textContent=msg; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',dur);
}
function setStatus(msg,cls=''){
  const el=$('db-status'); el.textContent=msg; el.className=cls;
}

// ── Language switch ──
window.setLang = function(l) {
  lang = l;
  localStorage.setItem('masi_lang', l);
  document.body.className = l==='ta' ? 'ta' : '';
  $('btn-en').classList.toggle('active', l==='en');
  $('btn-ta').classList.toggle('active', l==='ta');
  applyTranslations();
  renderBookSlots();
  renderAvailSlots();
  applyClosedState();
  if($('owner-panel').style.display!=='none') { renderBookingsList(); renderOwnerSlots(); }
};

function applyTranslations() {
  // Text content
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    const val = T[lang][key];
    if(val !== undefined && typeof val === 'string') el.textContent = val;
  });
  // Placeholders
  document.querySelectorAll('[data-ph]').forEach(el => {
    const key = el.getAttribute('data-ph');
    const val = T[lang][key];
    if(val) el.placeholder = val;
  });
  // Service select options — re-populate with translated text
  const svc = $('cust-service');
  const keys = ['selectService','sHaircut','sShave','sHaircutShave','sBeard','sColour','sFacial','sOther'];
  const vals = ['','Haircut','Shave','Haircut + Shave','Beard Trim','Hair Colour','Facial','Other'];
  Array.from(svc.options).forEach((opt,i) => {
    opt.textContent = T[lang][keys[i]] || T['en'][keys[i]];
    opt.value = i===0 ? '' : vals[i]; // keep consistent English value for storage
  });
}

// ── Navigation ──
window.showPage = function(name, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  $('page-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='availability') renderAvailSlots();
  if(name==='owner' && $('owner-panel').style.display!=='none') {
    renderOwnerSlots(); renderBookingsList();
  }
};

// ── Slot rendering ──
const bookedOn  = d => bookings.filter(b=>b.date===d).map(b=>b.slot);
const blockedOn = d => blocked[d] || [];

function renderSlots(cid, dateStr, mode) {
  const c=$(cid); if(!dateStr){c.innerHTML='';return;}
  const bkd=bookedOn(dateStr), blk=blockedOn(dateStr);
  c.innerHTML = ['09:00','09:30','10:00','10:30','11:00','11:30',
    '12:00','12:30','13:00','13:30','14:00','14:30',
    '15:00','15:30','16:00','16:30','17:00','17:30',
    '18:00','18:30','19:00','19:30','20:00','20:30'].map(s => {
    const isBooked  = bkd.includes(s);
    const isBlocked = blk.includes(s);
    let cls='slot';
    if(isBlocked) cls+=' blocked-slot';
    else if(isBooked) cls+=' booked';
    if(mode==='book' && s===selectedSlot) cls+=' selected';
    const lbl = isBooked ? s+' ✗' : isBlocked ? s+' 🔒' : s;
    let oc='';
    if(mode==='book'  && !isBooked && !isBlocked) oc=`onclick="window.__sel('${s}')"`;
    if(mode==='owner') oc=`onclick="window.__blk('${dateStr}','${s}')"`;
    return `<div class="${cls}" ${oc}>${lbl}</div>`;
  }).join('');
}

function renderBookSlots() {
  const d=$('book-date').value;
  $('day-name').textContent=dayLabel(d);
  renderSlots('book-slots',d,'book');
}
function renderAvailSlots() {
  const d=$('avail-date').value;
  $('avail-day-name').textContent=dayLabel(d);
  renderSlots('avail-slots',d,null);
}
function renderOwnerSlots() { renderSlots('owner-slots',$('owner-date').value,'owner'); }

window.__sel = s => { selectedSlot=s; renderBookSlots(); };

window.__blk = async (dateStr, slot) => {
  const list=blocked[dateStr]||[], idx=list.indexOf(slot);
  if(idx===-1) list.push(slot); else list.splice(idx,1);
  blocked[dateStr]=list;
  try {
    await setDoc(blockedDoc(), blocked);
    renderOwnerSlots();
    toast(idx===-1 ? t('tBlocked')(slot) : t('tUnblocked')(slot));
  } catch(e){ toast(t('tSlotErr')); }
};

// ── Closed state ──
function applyClosedState() {
  const c=settings.closed;
  $('closed-banner').style.display    = c?'block':'none';
  $('closed-display').style.display   = c?'block':'none';
  $('booking-form-wrap').style.display= c?'none':'block';
  const tog=$('closed-toggle'); if(tog) tog.checked=!!c;
}

// ── Real-time listeners ──
function startListeners() {
  onSnapshot(query(bookingsCol(),orderBy('ts','desc')), snap => {
    bookings=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderBookSlots();
    if($('page-availability').classList.contains('active')) renderAvailSlots();
    if($('owner-panel').style.display!=='none'){ renderBookingsList(); renderOwnerSlots(); }
    setStatus(t('tConnected'),'connected');
  }, e => setStatus(t('tDBError')(e.message),'error'));

  onSnapshot(settingsDoc(), snap => {
    settings = snap.exists() ? snap.data() : {closed:false};
    applyClosedState();
  });

  onSnapshot(blockedDoc(), snap => {
    blocked = snap.exists() ? snap.data() : {};
    renderBookSlots();
    if($('page-availability').classList.contains('active')) renderAvailSlots();
    if($('owner-panel').style.display!=='none') renderOwnerSlots();
  });
}

// ── Booking ──
$('book-btn').onclick = async () => {
  if(settings.closed){ toast(t('tClosed')); return; }
  const name    = $('cust-name').value.trim();
  const phone   = $('cust-phone').value.trim();
  const service = $('cust-service').value;
  const date    = $('book-date').value;
  if(!selectedSlot)           { toast(t('tSelectSlot')); return; }
  if(!name)                   { toast(t('tEnterName')); return; }
  if(!/^\d{10}$/.test(phone)) { toast(t('tValidPhone')); return; }
  if(!service)                { toast(t('tSelectSvc')); return; }
  if(bookings.some(b=>b.date===date&&b.slot===selectedSlot)){ toast(t('tSlotGone')); return; }

  const btn=$('book-btn');
  btn.disabled=true;
  btn.innerHTML=`<span class="spinner"></span>${t('tSaving')}`;
  try {
    const id=`${date}_${selectedSlot.replace(':','')}_${Date.now()}`;
    await setDoc(doc(bookingsCol(),id),{name,phone,service,date,slot:selectedSlot,ts:Date.now()});
    toast(t('tBooked')(selectedSlot, dayLabel(date)));
    selectedSlot=null;
    $('cust-name').value=''; $('cust-phone').value=''; $('cust-service').value='';
  } catch(e){ toast(t('tBookFail')); }
  finally{ btn.disabled=false; btn.textContent=t('btnConfirm'); }
};

// ── Owner login ──
const OWNER_PASS = "masi@0123"; // ← Change this if needed

$('login-btn').onclick = () => {
  const entered = $('owner-pass').value;
  // Trim to be safe against accidental spaces
  if(entered.trim() !== OWNER_PASS) {
    toast(t('tWrongPass')); return;
  }
  $('owner-login-wrap').style.display='none';
  $('owner-panel').style.display='block';
  applyClosedState(); renderOwnerSlots(); renderBookingsList();
};
$('logout-btn').onclick = () => {
  $('owner-login-wrap').style.display='block';
  $('owner-panel').style.display='none';
  $('owner-pass').value='';
};
$('owner-pass').onkeydown = e => { if(e.key==='Enter') $('login-btn').click(); };

// ── Toggle closed (Firestore) ──
$('closed-toggle').onchange = async () => {
  const v=$('closed-toggle').checked;
  try {
    await setDoc(settingsDoc(),{closed:v});
    toast(v ? t('tSalonClosed') : t('tSalonOpen'));
  } catch(e){ toast(t('tStatusErr')); }
};

// ── Bookings list ──
function renderBookingsList() {
  const list=$('bookings-list');
  const bks=[...bookings].sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
  if(!bks.length){ list.innerHTML=`<div class="empty">${t('noBookings')}</div>`; return; }
  list.innerHTML=bks.map(b=>`
    <div class="booking-card">
      <div>
        <div class="bname">${b.name} <span style="color:var(--muted);font-weight:400;font-size:.82rem;">· ${b.phone}</span></div>
        <div class="btime">${b.slot} · ${dayLabel(b.date)}</div>
        <div class="bservice">${b.service}</div>
      </div>
      <button class="del-btn" data-id="${b.id}">${t('remove')}</button>
    </div>`).join('');
  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = async () => {
      try { await deleteDoc(doc(bookingsCol(),btn.dataset.id)); toast(t('tRemoved')); }
      catch(e){ toast(t('tRemoveErr')); }
    };
  });
}

// ── QR ──
$('qr-input').onchange = e => {
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    $('qr-preview').innerHTML=`<img src="${ev.target.result}" alt="QR">`;
    localStorage.setItem('masi_qr',ev.target.result);
    toast(t('tQRSaved'));
  };
  r.readAsDataURL(file);
};
function loadQR(){
  const s=localStorage.getItem('masi_qr');
  if(s) $('qr-preview').innerHTML=`<img src="${s}" alt="QR">`;
}

// ── Date listeners ──
$('book-date').onchange  = renderBookSlots;
$('avail-date').onchange = ()=>{ $('avail-day-name').textContent=dayLabel($('avail-date').value); renderAvailSlots(); };
$('owner-date').onchange = renderOwnerSlots;

// ── Boot ──
(async()=>{
  const td=today();
  $('book-date').value=$('avail-date').value=$('owner-date').value=td;
  $('day-name').textContent=dayLabel(td);
  loadQR();
  applyTranslations();
  // apply saved lang
  if(lang==='ta'){ document.body.className='ta'; $('btn-ta').classList.add('active'); $('btn-en').classList.remove('active'); }
  try { startListeners(); }
  catch(e){ setStatus(t('tConnFail'),'error'); }
})();
</script>
</body>
</html>
